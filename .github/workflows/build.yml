name: Build VoidLink IPA

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build:
    name: Build and Package
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: Integration
          submodules: recursive # CRITICAL: Fetches moonlight-common and other dependencies

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Unsigned App
        run: |
          # Note: If the fork renamed the project file, replace Limelight.xcodeproj with the correct name
          xcodebuild build \
            -project "Limelight.xcodeproj" \
            -scheme "Limelight" \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CONFIGURATION_BUILD_DIR="$(pwd)/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          # Sideloading utilities expect the .app to be inside a "Payload" directory
          mkdir -p Payload
          # Move the compiled app into the Payload folder
          mv build/*.app Payload/
          # Zip the folder and rename the extension to .ipa
          zip -r VoidLink.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-IPA
          path: VoidLink.ipa
          retention-days: 7
